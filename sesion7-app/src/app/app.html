<mat-toolbar color="primary" class="barra">
  <mat-icon>
    menu_book
  </mat-icon>
  <span class="titulo">Mi biblioteca</span>
  <span class="spacer"></span>
</mat-toolbar>

<main class="contendor">
  <h2 class="seccion">Sesion 7 - Llamado APIs</h2>

  <mat-card class="infor-card">
    <mat-card-content>
      <p><strong>Endpoint:</strong> <code>{{ endpointLibros }}</code> </p>
      @if(seleccionado()){
        <p class="feature">{{ seleccionado() }}</p>
      }
    </mat-card-content>
  </mat-card>

  <h3>Catalogo (cards reutilizables)</h3>
  @if(catalogo().length > 0){
    <div class="grid-cards">
      @for (libro of catalogo(); track libro.id){
        <app-libro-card
          [libro]="libro"
          [destacado]="$first"
          (seleccionar)="onVer($event)"
          (eliminar)="onEliminar($event)"
        />
      }
    </div>
  }@else {
    <p>No hay libros en el catalogo.</p>
  }

</main>
